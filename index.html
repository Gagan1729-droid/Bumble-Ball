<!doctype html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bumble Ball</title>
    <meta name="description" content="Bumble Ball - A classic red ball physics platformer adventure built with Phaser 4 and TypeScript." />
    <meta property="og:title" content="Bumble Ball" />
    <meta property="og:description" content="Bumble Ball - A classic red ball physics platformer adventure built with Phaser 4 and TypeScript." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020617;
      }
      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #020617;
      }
      #game-container canvas {
        display: block;
        margin: auto !important; /* Prevents Phaser's autoCenter inline marginLeft/marginTop from doubling flexbox centering */
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        border-radius: 4px;
        max-width: 100vw;
        max-height: 100vh;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      }
      #loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .loader-ball {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ff4d6d, #e11d48 60%, #881337);
        box-shadow: 0 0 25px rgba(225, 29, 72, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.4);
        animation: loader-bounce 0.65s infinite alternate cubic-bezier(0.2, 0.8, 0.4, 1);
      }
      @keyframes loader-bounce {
        from {
          transform: translateY(0) scale(1.1, 0.9);
        }
        to {
          transform: translateY(-26px) scale(0.95, 1.05);
        }
      }
      .loader-title {
        margin-top: 22px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 2.5px;
        color: #f8fafc;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      .loader-subtitle {
        margin-top: 6px;
        font-size: 12px;
        letter-spacing: 1px;
        color: #38bdf8;
      }
      .loader-bar-bg {
        margin-top: 14px;
        width: 140px;
        height: 4px;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar-fill {
        width: 45%;
        height: 100%;
        background: #38bdf8;
        border-radius: 9999px;
        animation: loader-bar 1.1s infinite ease-in-out;
      }
      @keyframes loader-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden select-none bg-slate-950">
    <!-- Initial Loading Screen to prevent black flash during asset initialization -->
    <div id="loading-overlay">
      <div class="loader-content">
        <div class="loader-ball"></div>
        <div class="loader-title">BUMBLE BALL</div>
        <div class="loader-subtitle">Loading adventure...</div>
        <div class="loader-bar-bg">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
